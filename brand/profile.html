<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0B1020; }
  body { display: flex; align-items: center; justify-content: center; }
  .mark { font: 700 400px/1 "Space Grotesk", sans-serif; letter-spacing: -8px; display:flex; align-items:flex-end; color: #F4F1EA; position: relative; }
  .mark span { color: #C6FF3D; }
  .dot { width: 90px; height: 90px; border-radius: 50%; background: #C6FF3D; margin: 0 0 30px 22px; flex: none; }
</style>
</head>
<body><div class="mark">S<span>H</span><div class="dot"></div></div></body>
</html>
